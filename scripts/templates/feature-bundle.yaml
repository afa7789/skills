# Source-of-truth for the `/feature` slash bundle.
# Hermes' bundle loader reads `~/.hermes/skill-bundles/<slug>.yaml`;
# scripts/sync-skills.sh copies this file there on each sync.
# Edit this file, not ~/.hermes/skill-bundles/feature-bundle.yaml.
#
# Verify with: hermes bundles list
# Invoke with: /feature <description>
name: feature
description: Build features end-to-end — fdd (feature graph + binary-checked dagRobin DAG) → dag-loop (external driver) → review.
skills:
  - fdd
  - dag-loop
  - review
instruction: |
  Run the feature pipeline in this order; each step consumes the previous artifact.

  1. /fdd — turn the request into features/graph.yaml and features/tasks.yaml
     (every task carries one binary metadata.check), then
     `dagRobin import features/tasks.yaml` and the skill's check-dag.sh.

  2. /dag-loop — start the external driver (`--host hermes`). It claims each
     ready task, runs a worker in its own git worktree, and lets
     `dagRobin verify` decide done. Do not loop in conversation.

  3. /review — review the merged commits against each task's check and the
     ponytail lens. FAIL → new dagRobin task, back to step 2.

  The user said: $ARGUMENTS
